spring:
  application.name: lambda-core
  # prevents put body from being eaten as form params // whatever
  mvc.formcontent.filter.enabled: false
  # async http requests default 30s container timeout overwrite
  mvc.async.request-timeout: -1
  datasource:
    url: ${LAMBDA_DB_URL:jdbc:postgresql://localhost:5432/lambda}
    username: ${LAMBDA_DB_USER:lambda}
    password: ${LAMBDA_DB_PASSWORD:lambda}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
    properties.hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

server.port: ${LAMBDA_PORT:8080}

management:
  # metrics go out on their own port so the gateway never serves them
  server.port: ${LAMBDA_MANAGEMENT_PORT:${LAMBDA_PORT:8080}}
  endpoints.web.exposure.include: health,prometheus
  endpoint.health.probes.enabled: true

lambda.auth:
  jwks-uri: ${LAMBDA_AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
  issuer: ${LAMBDA_AUTH_ISSUER:http://localhost:8081}

lambda.storage:
  root: ${LAMBDA_STORAGE_ROOT:./data}
  # 2gb
  max-file-bytes: ${LAMBDA_MAX_FILE_BYTES:2147483648}
  # 2.5gb, the same for everyone
  quota-default-bytes: ${LAMBDA_QUOTA_DEFAULT_BYTES:2684354560}
  # everything in the swap together, 5gb
  share-total-bytes: ${LAMBDA_SHARE_TOTAL_BYTES:5368709120}
  # uploads stop when the disk has less than this left, 1gb
  min-free-bytes: ${LAMBDA_MIN_FREE_BYTES:1073741824}

logging.level:
  com.microchip.lambda_core: INFO
